worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;

    ####################################################
    # 🔹 MICROSERVICIOS AGRUPADOS POR IP
    ####################################################

    # 🟦 IP: 54.243.94.215
    upstream auth_service             { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }
    upstream connected_service        { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }
    upstream profile_image_service    { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }

    # 🟩 IP: 54.243.94.215
    upstream user_soap_service        { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }
    upstream user_search_service      { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }
    upstream session_service          { server userdomain-alb-1428821210.us-east-1.elb.amazonaws.com; }

    # 🟨 IP: 34.236.169.1
    upstream image_service            { server 34.193.65.142:5009; }
    upstream grpc_image_del_service   { server 34.193.65.142:5014; }
    upstream catalog_service          { server 34.193.65.142:5003; }
    upstream catalog_del_service      { server 34.193.65.142:5011; }

    # 🟥 IP: 3.224.44.87
    upstream custom_service           { server 34.193.65.142:5007; }
    upstream custom_up_service        { server 34.193.65.142:5013; }
    upstream custom_del_service       { server 34.193.65.142:5012; }

    # 🟪 IP: 54.166.118.216
    upstream redis_service            { server 54.90.161.226:5006; }
    upstream chat_ws_service          { server 54.90.161.226:5010; }
    upstream search_model_service     { server 54.90.161.226:5005; }

    # 🟫 IP: 52.5.219.178
    upstream order_status_service     { server 35.168.99.213:5017; }
    upstream order_complete_service   { server 35.168.99.213:5019; }
    upstream order_service            { server 35.168.99.213:5008; }
    upstream requests_service         { server 35.168.99.213:5018; }

    ####################################################
    # 🌐 CONFIGURACIÓN CORS - map para múltiples orígenes
    ####################################################
    map $http_origin $cors_origin {
        default "";
        "http://34.236.169.1:8080" $http_origin;
        "http://34.193.65.142:5007"   $http_origin;
        "http://50.19.4.172/custom"   $http_origin;
    }

    ####################################################
    # 🌐 SERVIDOR NGINX
    ####################################################
    server {
        listen 80;

        # 🔐 CORS GLOBAL - usando variable map
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 💡 Opciones preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        ####################################################
        # 📤 RUTA: Subida de imágenes con límite ampliado
        ####################################################
        location ~ ^/profile-image/(.*)$ {
            client_max_body_size 20M;
            proxy_pass http://profile_image_service/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🚀 RUTAS TRADICIONALES
        ####################################################
        location ~ ^/(auth|user-soap|session)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "auth")          { set $target http://auth_service; }
            if ($prefix = "user-soap")     { set $target http://user_soap_service; }
            if ($prefix = "session")       { set $target http://session_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🆕 RUTAS DINÁMICAS - NUEVOS MICROSERVICIOS
        ####################################################
        location ~ ^/(image|grpc-image-del|catalog|catalog-del|custom|custom-up|custom-del)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "image")           { set $target http://image_service; }
            if ($prefix = "grpc-image-del")  { set $target http://grpc_image_del_service; }
            if ($prefix = "catalog")         { set $target http://catalog_service; }
            if ($prefix = "catalog-del")     { set $target http://catalog_del_service; }
            if ($prefix = "custom")          { set $target http://custom_service; }
            if ($prefix = "custom-up")       { set $target http://custom_up_service; }
            if ($prefix = "custom-del")      { set $target http://custom_del_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🧠 REDIS SERVICE
        ####################################################
        location /redis/ {
            proxy_pass http://redis_service/;  
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ####################################################
        # 💬 CHAT (WEBSOCKET)
        ####################################################
        location /ws/ {
            proxy_pass http://chat_ws_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🔍 BÚSQUEDA DE MODELOS
        ####################################################
        location /search-model/ {
            proxy_pass http://search_model_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept application/json;
        }

        ####################################################
        # 👤 BÚSQUEDA DE USUARIOS
        ####################################################
        location /user-search/ {
            proxy_pass http://user_search_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🌟 connected_service
        ####################################################
        location /connected/ {
            proxy_pass http://connected_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 📦 ORDER SERVICES
        ####################################################
        location /order-status/ {
            proxy_pass http://order_status_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /order-complete/ {
            proxy_pass http://order_complete_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /order/ {
            proxy_pass http://order_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /requests/ {
            proxy_pass http://requests_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}