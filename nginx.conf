worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 🔁 Mapea prefijos a upstreams
    map $uri $target_upstream {
        default "";
        ~^/auth/          http://auth_service;
        ~^/connected/     http://connected_service;
        ~^/user-soap/     http://user_soap_service;
        ~^/user-search/   http://user_search_service;
        ~^/session/       http://session_service;
        ~^/profile-image/ http://profile_image_service;
    }

    upstream auth_service {
        server 54.243.94.215:5001;
    }

    upstream connected_service {
        server 54.243.94.215:5020;
    }

    upstream user_soap_service {
        server 34.193.65.142:5002;
    }

    upstream user_search_service {
        server 34.193.65.142:5016;
    }

    upstream session_service {
        server 34.193.65.142:5004;
    }

    upstream profile_image_service {
        server 54.243.94.215:5015;
    }

    server {
        listen 80;

        # 🌐 CORS global
        add_header 'Access-Control-Allow-Origin' 'http://3.227.120.143:8080' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ⚙️ Manejo global para preflight OPTIONS
        if ($request_method = OPTIONS) {
            return 204;
        }

        # 📦 Ruta dinámica que detecta el servicio
        location ~ ^/(auth|connected|user-soap|user-search|session|profile-image)/(.*) {
            proxy_pass $target_upstream/$2;  # Elimina el prefijo
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            add_header 'Access-Control-Allow-Origin' 'http://3.227.120.143:8080' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        }
    }
}