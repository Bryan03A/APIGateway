worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Tamaño máximo permitido para carga de archivos (por ejemplo, 20 megabytes)
    client_max_body_size 20M;

    upstream auth_service {
        server 54.243.94.215:5001;
    }

    upstream connected_service {
        server 54.243.94.215:5020;
    }

    upstream user_soap_service {
        server 34.193.65.142:5002;
    }

    upstream user_search_service {
        server 34.193.65.142:5016;
    }

    upstream session_service {
        server 34.193.65.142:5004;
    }

    upstream profile_image_service {
        server 54.243.94.215:5015;
    }

    # 🔹 Nuevos microservicios - IP: 34.236.169.1
    upstream image_service {
        server 34.236.169.1:5009;
    }

    upstream grpc_image_del_service {
        server 34.236.169.1:5014;
    }

    upstream catalog_service {
        server 34.236.169.1:5003;
    }

    upstream catalog_del_service {
        server 34.236.169.1:5011;
    }

    # 🔹 Nuevos microservicios - IP: 3.224.44.87
    upstream custom_service {
        server 3.224.44.87:5007;
    }

    upstream custom_up_service {
        server 3.224.44.87:5013;
    }

    upstream custom_del_service {
        server 3.224.44.87:5012;
    }

    server {
        listen 80;

        # CORS global para todas las respuestas
        add_header 'Access-Control-Allow-Origin' 'http://3.227.120.143:8080' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Manejo global para preflight OPTIONS
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Ruta específica para profile-image con client_max_body_size configurado
        location ~ ^/profile-image/(.*)$ {
            client_max_body_size 20M;

            proxy_pass http://profile_image_service/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rutas dinámicas para los otros servicios
        location ~ ^/(auth|connected|user-soap|user-search|session)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "auth")          { set $target http://auth_service; }
            if ($prefix = "connected")     { set $target http://connected_service; }
            if ($prefix = "user-soap")     { set $target http://user_soap_service; }
            if ($prefix = "user-search")   { set $target http://user_search_service; }
            if ($prefix = "session")       { set $target http://session_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 🔹 Nuevas rutas dinámicas para nuevos microservicios
        location ~ ^/(image|grpc-image-del|catalog|catalog-del|custom|custom-up|custom-del)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "image")           { set $target http://image_service; }
            if ($prefix = "grpc-image-del")  { set $target http://grpc_image_del_service; }
            if ($prefix = "catalog")         { set $target http://catalog_service; }
            if ($prefix = "catalog-del")     { set $target http://catalog_del_service; }
            if ($prefix = "custom")          { set $target http://custom_service; }
            if ($prefix = "custom-up")       { set $target http://custom_up_service; }
            if ($prefix = "custom-del")      { set $target http://custom_del_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}