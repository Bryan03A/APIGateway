worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Tamaño máximo permitido para carga de archivos (por ejemplo, 20 megabytes)
    client_max_body_size 20M;

    upstream auth_service {
        server 54.243.94.215:5001;
    }

    upstream connected_service {
        server 54.243.94.215:5020;
    }

    upstream user_soap_service {
        server 34.193.65.142:5002;
    }

    upstream user_search_service {
        server 34.193.65.142:5016;
    }

    upstream session_service {
        server 34.193.65.142:5004;
    }

    upstream profile_image_service {
        server 54.243.94.215:5015;
    }

    server {
        listen 80;

        # Responder OPTIONS globalmente para preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;
            return 204;
        }

        # Profile image con client_max_body_size
        location ~ ^/profile-image/(.*)$ {
            client_max_body_size 20M;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            proxy_pass http://profile_image_service/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rutas dinámicas para los otros servicios
        location ~ ^/(auth|connected|user-soap|user-search|session)/(.*)$ {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            set $prefix $1;
            set $rest /$2;

            if ($prefix = "auth")          { set $target http://auth_service; }
            if ($prefix = "connected")     { set $target http://connected_service; }
            if ($prefix = "user-soap")     { set $target http://user_soap_service; }
            if ($prefix = "user-search")   { set $target http://user_search_service; }
            if ($prefix = "session")       { set $target http://session_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}