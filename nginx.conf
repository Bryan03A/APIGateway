worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;

    ####################################################
    # 🔹 MICROSERVICIOS AGRUPADOS POR IP
    ####################################################

    # 🟦 IP: 54.243.94.215
    upstream auth_service             { server 54.243.94.215:5001; }
    upstream connected_service        { server 54.243.94.215:5020; }
    upstream profile_image_service    { server 54.243.94.215:5015; }

    # 🟩 IP: 34.193.65.142
    upstream user_soap_service        { server 34.193.65.142:5002; }
    upstream user_search_service      { server 34.193.65.142:5016; }
    upstream session_service          { server 34.193.65.142:5004; }

    # 🟨 IP: 34.236.169.1
    upstream image_service            { server 34.236.169.1:5009; }
    upstream grpc_image_del_service  { server 34.236.169.1:5014; }
    upstream catalog_service          { server 34.236.169.1:5003; }
    upstream catalog_del_service      { server 34.236.169.1:5011; }

    # 🟥 IP: 3.224.44.87
    upstream custom_service           { server 3.224.44.87:5007; }
    upstream custom_up_service        { server 3.224.44.87:5013; }
    upstream custom_del_service       { server 3.224.44.87:5012; }

    # 🟪 IP: 54.166.118.216
    upstream redis_service            { server 54.166.118.216:5006; }
    upstream chat_ws_service          { server 54.166.118.216:5010; }
    upstream search_model_service     { server 54.166.118.216:5005; }

    ####################################################
    # 🌐 SERVIDOR NGINX
    ####################################################

    server {
        listen 80;

        # 🔐 CORS GLOBAL
        add_header 'Access-Control-Allow-Origin' 'http://3.227.120.143:8080' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 💡 Opciones preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        ####################################################
        # 📤 RUTA: Subida de imágenes con límite ampliado
        ####################################################
        location ~ ^/profile-image/(.*)$ {
            client_max_body_size 20M;
            proxy_pass http://profile_image_service/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🚀 RUTAS TRADICIONALES
        ####################################################
        location ~ ^/(auth|user-soap|session)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "auth")          { set $target http://auth_service; }
            if ($prefix = "user-soap")     { set $target http://user_soap_service; }
            if ($prefix = "session")       { set $target http://session_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🆕 RUTAS DINÁMICAS - NUEVOS MICROSERVICIOS
        ####################################################
        location ~ ^/(image|grpc-image-del|catalog|catalog-del|custom|custom-up|custom-del)/(.*)$ {
            set $prefix $1;
            set $rest /$2;

            if ($prefix = "image")           { set $target http://image_service; }
            if ($prefix = "grpc-image-del")  { set $target http://grpc_image_del_service; }
            if ($prefix = "catalog")         { set $target http://catalog_service; }
            if ($prefix = "catalog-del")     { set $target http://catalog_del_service; }
            if ($prefix = "custom")          { set $target http://custom_service; }
            if ($prefix = "custom-up")       { set $target http://custom_up_service; }
            if ($prefix = "custom-del")      { set $target http://custom_del_service; }

            proxy_pass $target$rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🧠 REDIS SERVICE
        ####################################################
        location /redis/ {
            proxy_pass http://redis_service/;  
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ####################################################
        # 💬 CHAT (WEBSOCKET)
        ####################################################
        location /ws/ {
            proxy_pass http://chat_ws_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🔍 BÚSQUEDA DE MODELOS
        ####################################################
        location /search-model/ {
            proxy_pass http://search_model_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept application/json;
        }

        ####################################################
        # 👤 BÚSQUEDA DE USUARIOS
        ####################################################
        location /user-search/ {
            proxy_pass http://user_search_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ####################################################
        # 🌟 connected_service
        ####################################################
        location /connected/ {
            proxy_pass http://connected_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
